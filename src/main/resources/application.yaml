spring:
  application:
    name: ai-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/ai"
  ai:
    openai:
      api-key: ${openai-token:dummy}
      chat:
        model: gpt-4o-mini

server:
  port: 6200

logbook:
  format:
    style: json

logging:
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local

server:
  port: 6004
management:
  server:
    port: 8004

logbook:
  format:
    style: http